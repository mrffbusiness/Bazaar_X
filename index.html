<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f5f5;color:#333;font-size:14px}
:root{--orange:#f57224;--orange-dark:#d4611e;--orange-light:#fff3ec;--dark:#333;--gray:#666;--light-gray:#f0f0f0;--white:#fff;--green:#0a8a00;--red:#d0021b;--border:#e0e0e0;--blue:#1a73e8}

/* HEADER */
.header{background:var(--orange);position:sticky;top:0;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.header-top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1200px;margin:0 auto}
.logo{color:#fff;font-size:22px;font-weight:800;letter-spacing:-0.5px;cursor:pointer;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.logo span{color:#ffe;font-weight:400;font-size:11px;display:block;letter-spacing:1px;margin-top:-3px}
.search-bar{flex:1;display:flex;border-radius:4px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.search-bar input{flex:1;padding:10px 14px;border:none;outline:none;font-size:14px;background:#fff}
.search-bar select{border:none;background:#f7f7f7;padding:0 10px;font-size:13px;cursor:pointer;border-left:1px solid #ddd;outline:none;color:#555}
.search-btn{background:var(--orange-dark);color:#fff;border:none;padding:0 18px;cursor:pointer;font-size:18px;display:flex;align-items:center}
.search-btn:hover{background:#b8541a}
.header-actions{display:flex;gap:4px}
.header-btn{background:none;border:none;color:#fff;cursor:pointer;padding:6px 10px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;transition:background .15s;position:relative}
.header-btn:hover{background:rgba(0,0,0,.15)}
.header-btn svg{width:22px;height:22px}
.cart-badge,.notif-badge{position:absolute;top:2px;right:4px;background:#fff;color:var(--orange);border-radius:50%;width:16px;height:16px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}

/* NAV */
.nav{background:var(--orange-dark);display:flex;gap:0;padding:0 16px;max-width:1200px;margin:0 auto;overflow-x:auto}
.nav::-webkit-scrollbar{height:0}
.nav-item{color:#fff;padding:8px 14px;cursor:pointer;font-size:13px;white-space:nowrap;border-radius:0;transition:background .15s;display:flex;align-items:center;gap:5px}
.nav-item:hover,.nav-item.active{background:rgba(0,0,0,.2);font-weight:600}
.nav-inner{background:var(--orange-dark)}

/* LAYOUT */
.main-wrap{max-width:1200px;margin:0 auto;padding:0 8px}

/* BANNER */
.hero-section{display:grid;grid-template-columns:1fr 320px;gap:8px;margin:12px 0 8px}
.hero-banner{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);border-radius:6px;overflow:hidden;position:relative;min-height:280px;display:flex;align-items:center;padding:32px 40px;cursor:pointer}
.hero-text{color:#fff;z-index:1}
.hero-label{background:var(--orange);color:#fff;padding:3px 10px;border-radius:2px;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:10px;display:inline-block}
.hero-title{font-size:30px;font-weight:800;line-height:1.2;margin-bottom:8px}
.hero-title span{color:var(--orange)}
.hero-sub{color:#aac;font-size:14px;margin-bottom:18px}
.hero-cta{background:var(--orange);color:#fff;border:none;padding:10px 24px;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer}
.hero-cta:hover{background:var(--orange-dark)}
.hero-deco{position:absolute;right:-20px;bottom:-20px;width:260px;height:260px;background:rgba(255,255,255,.03);border-radius:50%}
.hero-deco2{position:absolute;right:60px;top:-40px;width:180px;height:180px;background:rgba(245,114,36,.08);border-radius:50%}
.side-banners{display:flex;flex-direction:column;gap:8px}
.side-banner{border-radius:6px;overflow:hidden;cursor:pointer;flex:1;display:flex;align-items:center;padding:16px 20px;gap:16px;transition:opacity .15s}
.side-banner:hover{opacity:.9}
.side-banner.sb1{background:linear-gradient(135deg,#e84393,#9c27b0)}
.side-banner.sb2{background:linear-gradient(135deg,#00bcd4,#0097a7)}
.sb-icon{font-size:36px}
.sb-text{color:#fff}
.sb-text strong{font-size:16px;font-weight:700;display:block}
.sb-text span{font-size:12px;opacity:.85}

/* FLASH SALE */
.section-header{display:flex;align-items:center;gap:12px;margin:16px 0 12px;padding-bottom:10px;border-bottom:2px solid var(--orange)}
.section-title{font-size:18px;font-weight:800;color:#333;display:flex;align-items:center;gap:8px}
.flash-badge{background:var(--orange);color:#fff;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.5px}
.timer{display:flex;align-items:center;gap:4px;font-size:13px;color:#555}
.timer-block{background:#333;color:#fff;padding:3px 7px;border-radius:3px;font-weight:700;font-size:13px;min-width:28px;text-align:center}
.see-all{margin-left:auto;color:var(--orange);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:3px}
.see-all:hover{text-decoration:underline}

/* PRODUCT GRID */
.product-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px}
.product-row.r5{grid-template-columns:repeat(5,1fr)}
.product-card{background:#fff;border-radius:4px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .1s;border:1px solid #eee;position:relative}
.product-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.12);transform:translateY(-2px)}
.product-img{width:100%;aspect-ratio:1;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:50px;background:#f9f9f9;border-bottom:1px solid #f0f0f0}
.product-info{padding:8px}
.product-name{font-size:12px;color:#333;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;height:31px}
.product-price{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.price-current{font-size:15px;font-weight:700;color:var(--orange)}
.price-old{font-size:11px;color:#999;text-decoration:line-through}
.discount-badge{position:absolute;top:6px;left:6px;background:var(--orange);color:#fff;padding:2px 6px;border-radius:2px;font-size:10px;font-weight:700}
.rating-row{display:flex;align-items:center;gap:4px}
.stars{color:#f5a623;font-size:11px;letter-spacing:-1px}
.rating-count{font-size:10px;color:#999}
.wishlist-btn{position:absolute;top:6px;right:6px;background:#fff;border:1px solid #eee;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;opacity:0;transition:opacity .15s}
.product-card:hover .wishlist-btn{opacity:1}
.wishlist-btn.active,.wishlist-btn:hover{opacity:1;color:var(--red)}
.add-cart-btn{width:100%;background:var(--orange);color:#fff;border:none;padding:6px;font-size:11px;font-weight:600;cursor:pointer;border-top:1px solid #f0f0f0;transition:background .15s}
.add-cart-btn:hover{background:var(--orange-dark)}

/* CATEGORY GRID */
.cat-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin:8px 0 16px;background:#fff;padding:16px;border-radius:6px;border:1px solid #eee}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:10px 4px;border-radius:4px;transition:background .15s}
.cat-item:hover{background:var(--orange-light)}
.cat-icon{font-size:30px;line-height:1}
.cat-name{font-size:10px;color:#555;text-align:center;font-weight:500}

/* BRANDS */
.brands-row{display:flex;gap:8px;background:#fff;padding:12px 16px;border-radius:6px;border:1px solid #eee;overflow-x:auto;margin-bottom:8px}
.brand-chip{padding:6px 16px;border:1px solid #e0e0e0;border-radius:20px;font-size:12px;color:#555;cursor:pointer;white-space:nowrap;transition:all .15s}
.brand-chip:hover,.brand-chip.active{background:var(--orange);color:#fff;border-color:var(--orange)}

/* CART DRAWER */
.cart-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s}
.cart-overlay.open{opacity:1;pointer-events:all}
.cart-drawer{position:fixed;top:0;right:-420px;width:420px;height:100vh;background:#fff;z-index:2001;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.15);transition:right .25s cubic-bezier(.4,0,.2,1)}
.cart-drawer.open{right:0}
.cart-header{background:var(--orange);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.cart-header h3{font-size:16px;font-weight:700}
.close-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.cart-body{flex:1;overflow-y:auto;padding:16px}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:#999}
.cart-empty-icon{font-size:60px}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0}
.cart-item-img{width:72px;height:72px;background:#f9f9f9;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;border:1px solid #eee}
.cart-item-info{flex:1}
.cart-item-name{font-size:13px;color:#333;margin-bottom:4px;line-height:1.3}
.cart-item-price{font-size:14px;font-weight:700;color:var(--orange)}
.cart-item-qty{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty-btn{background:none;border:1px solid #ddd;border-radius:4px;width:26px;height:26px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .1s}
.qty-btn:hover{background:#f5f5f5}
.qty-num{font-size:13px;font-weight:600;min-width:20px;text-align:center}
.remove-btn{background:none;border:none;color:#999;cursor:pointer;font-size:18px;margin-left:auto;align-self:flex-start}
.remove-btn:hover{color:var(--red)}
.cart-footer{padding:16px;border-top:1px solid #eee;background:#fafafa}
.cart-summary{margin-bottom:12px}
.cart-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:#666}
.cart-row.total{font-size:15px;font-weight:700;color:#333;border-top:1px solid #eee;padding-top:8px;margin-top:8px}
.checkout-btn{width:100%;background:var(--orange);color:#fff;border:none;padding:13px;border-radius:4px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s}
.checkout-btn:hover{background:var(--orange-dark)}

/* PRODUCT MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:3000;opacity:0;pointer-events:none;transition:opacity .2s;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:20px}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:8px;max-width:900px;width:100%;margin:auto;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.modal-img{background:#f9f9f9;display:flex;align-items:center;justify-content:center;font-size:120px;min-height:380px;border-right:1px solid #f0f0f0;padding:30px}
.modal-info{padding:28px;overflow-y:auto;max-height:600px}
.modal-badge{background:var(--orange-light);color:var(--orange);padding:2px 8px;border-radius:2px;font-size:11px;font-weight:700;margin-bottom:10px;display:inline-block}
.modal-title{font-size:18px;font-weight:700;line-height:1.3;margin-bottom:10px;color:#333}
.modal-rating{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #f0f0f0}
.modal-price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.modal-price{font-size:26px;font-weight:800;color:var(--orange)}
.modal-old{font-size:16px;color:#999;text-decoration:line-through}
.modal-disc{background:var(--orange);color:#fff;padding:2px 8px;border-radius:3px;font-size:13px;font-weight:700}
.modal-shipping{background:#f0fff4;border:1px solid #c6f6d5;border-radius:4px;padding:8px 12px;font-size:12px;color:var(--green);margin-bottom:14px}
.modal-qty-label{font-size:13px;color:#555;margin-bottom:8px;font-weight:600}
.modal-qty{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modal-qty-btn{border:1px solid #ddd;background:#fff;width:32px;height:32px;border-radius:4px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.modal-qty-num{font-size:16px;font-weight:700;min-width:30px;text-align:center}
.modal-actions{display:flex;gap:10px;margin-bottom:14px}
.modal-cart-btn{flex:1;background:var(--orange);color:#fff;border:none;padding:12px;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer}
.modal-cart-btn:hover{background:var(--orange-dark)}
.modal-buy-btn{flex:1;background:#fff;color:var(--orange);border:2px solid var(--orange);padding:12px;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer}
.modal-buy-btn:hover{background:var(--orange-light)}
.modal-specs{border-top:1px solid #f0f0f0;padding-top:14px;margin-top:4px}
.spec-row{display:flex;font-size:12px;padding:5px 0;border-bottom:1px solid #f9f9f9}
.spec-key{color:#888;width:40%;flex-shrink:0}
.spec-val{color:#333;font-weight:500}
.modal-close{position:absolute;top:16px;right:16px;background:#fff;border:1px solid #eee;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:1}
.modal-close:hover{background:#f5f5f5}
.modal-wrap{position:relative}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:5000;transition:transform .25s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--green)}

/* LOGIN MODAL */
.auth-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:4000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.auth-overlay.open{opacity:1;pointer-events:all}
.auth-modal{background:#fff;border-radius:8px;width:400px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-header{background:var(--orange);padding:20px 24px;color:#fff}
.auth-header h2{font-size:18px;font-weight:700}
.auth-header p{font-size:13px;opacity:.85;margin-top:4px}
.auth-body{padding:24px}
.auth-tabs{display:flex;border-bottom:2px solid #eee;margin-bottom:20px}
.auth-tab{flex:1;padding:10px;background:none;border:none;font-size:14px;font-weight:600;cursor:pointer;color:#999;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.auth-tab.active{color:var(--orange);border-bottom-color:var(--orange)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:5px}
.form-group input{width:100%;border:1px solid #ddd;border-radius:4px;padding:9px 12px;font-size:14px;outline:none;transition:border .15s}
.form-group input:focus{border-color:var(--orange)}
.auth-submit{width:100%;background:var(--orange);color:#fff;border:none;padding:11px;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}
.auth-submit:hover{background:var(--orange-dark)}
.auth-hint{font-size:11px;color:#999;text-align:center;margin-top:10px}
.auth-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#fff;font-size:22px;cursor:pointer}

/* SEARCH RESULTS */
.search-results{background:#fff;position:absolute;top:100%;left:0;right:0;z-index:500;border-radius:0 0 6px 6px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:400px;overflow-y:auto;border-top:1px solid #eee}
.search-result-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid #f5f5f5;transition:background .1s}
.search-result-item:hover{background:#fef9f6}
.sr-icon{font-size:30px;width:44px;height:44px;background:#f9f9f9;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sr-info{flex:1}
.sr-name{font-size:13px;color:#333;font-weight:500}
.sr-price{font-size:12px;color:var(--orange);font-weight:700}

/* ORDER TRACKER */
.track-section{background:#fff;border-radius:6px;padding:24px;border:1px solid #eee;margin:12px 0}
.track-input-row{display:flex;gap:10px;margin-bottom:20px}
.track-input{flex:1;border:1px solid #ddd;border-radius:4px;padding:10px 14px;font-size:14px;outline:none}
.track-input:focus{border-color:var(--orange)}
.track-btn{background:var(--orange);color:#fff;border:none;padding:10px 20px;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer}
.track-btn:hover{background:var(--orange-dark)}
.tracker{display:flex;gap:0;margin-top:20px}
.track-step{flex:1;text-align:center;position:relative}
.track-step::before{content:'';position:absolute;top:16px;left:-50%;right:50%;height:3px;background:#e0e0e0;z-index:0}
.track-step:first-child::before{display:none}
.track-step.done::before{background:var(--green)}
.track-dot{width:34px;height:34px;border-radius:50%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:16px;position:relative;z-index:1;transition:all .3s}
.track-step.done .track-dot{background:var(--green);box-shadow:0 0 0 4px rgba(10,138,0,.15)}
.track-step.active .track-dot{background:var(--orange);box-shadow:0 0 0 4px rgba(245,114,36,.2)}
.track-label{font-size:11px;color:#888;font-weight:600}
.track-step.done .track-label,.track-step.active .track-label{color:#333}

/* SELLER PORTAL */
.seller-section{background:#fff;border-radius:6px;border:1px solid #eee;overflow:hidden;margin:12px 0}
.seller-hero{background:linear-gradient(135deg,var(--orange),#d4611e);padding:32px;color:#fff;text-align:center}
.seller-hero h2{font-size:24px;font-weight:800;margin-bottom:8px}
.seller-hero p{opacity:.9;font-size:15px;margin-bottom:20px}
.seller-cta{background:#fff;color:var(--orange);border:none;padding:12px 28px;border-radius:4px;font-size:15px;font-weight:700;cursor:pointer}
.seller-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid #eee}
.seller-stat{padding:20px;text-align:center;border-right:1px solid #eee}
.seller-stat:last-child{border-right:none}
.seller-stat strong{font-size:22px;font-weight:800;color:var(--orange);display:block}
.seller-stat span{font-size:12px;color:#888}
.seller-features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px}
.seller-feature{text-align:center;padding:16px}
.sf-icon{font-size:36px;margin-bottom:8px}
.sf-title{font-size:14px;font-weight:700;margin-bottom:4px}
.sf-desc{font-size:12px;color:#888}

/* BOTTOM NAV */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;z-index:900;padding:8px 0 10px}
.bottom-nav-items{display:flex;justify-content:space-around}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:#888;font-size:10px;padding:4px 10px;border-radius:4px;transition:color .15s;position:relative}
.bn-item.active,.bn-item:hover{color:var(--orange)}
.bn-icon{font-size:20px}

/* VOUCHER */
.voucher-banner{background:linear-gradient(135deg,#ff6b6b,#ee0979);border-radius:6px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:8px;cursor:pointer}
.voucher-banner:hover{opacity:.95}
.vb-left strong{font-size:16px;font-weight:800;display:block}
.vb-left span{font-size:12px;opacity:.9}
.vb-right{font-size:28px}

/* FOOTER */
.footer{background:#333;color:#aaa;margin-top:24px;padding:32px 16px 16px}
.footer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:1200px;margin:0 auto 24px}
.footer h4{color:#fff;font-size:13px;font-weight:700;margin-bottom:12px}
.footer a{color:#aaa;text-decoration:none;font-size:12px;display:block;margin-bottom:6px;cursor:pointer}
.footer a:hover{color:var(--orange)}
.footer-bottom{border-top:1px solid #444;padding-top:16px;text-align:center;font-size:11px;max-width:1200px;margin:0 auto}
.payment-icons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.payment-icon{background:#444;color:#ddd;padding:3px 8px;border-radius:3px;font-size:10px;font-weight:600}

/* BREADCRUMB */
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:#888;padding:10px 0}
.breadcrumb span{cursor:pointer;color:var(--orange)}
.breadcrumb span:hover{text-decoration:underline}

/* FILTER SIDEBAR (for category page) */
.cat-page{display:grid;grid-template-columns:220px 1fr;gap:12px;margin:12px 0}
.filter-sidebar{background:#fff;border-radius:6px;border:1px solid #eee;padding:16px;align-self:start;position:sticky;top:60px}
.filter-section{border-bottom:1px solid #f0f0f0;padding-bottom:12px;margin-bottom:12px}
.filter-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.filter-title{font-size:13px;font-weight:700;color:#333;margin-bottom:10px}
.filter-option{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;font-size:12px;color:#555}
.filter-option input{accent-color:var(--orange)}
.price-range{display:flex;gap:8px;align-items:center}
.price-input{width:80px;border:1px solid #ddd;border-radius:3px;padding:5px 8px;font-size:12px;outline:none}
.price-input:focus{border-color:var(--orange)}

/* RESPONSIVE */
@media(max-width:768px){
  .hero-section{grid-template-columns:1fr}
  .side-banners{flex-direction:row}
  .side-banner{min-width:160px}
  .product-row{grid-template-columns:repeat(3,1fr)}
  .cat-grid{grid-template-columns:repeat(5,1fr)}
  .footer-grid{grid-template-columns:repeat(2,1fr)}
  .bottom-nav{display:block}
  body{padding-bottom:60px}
  .modal-grid{grid-template-columns:1fr}
  .modal-img{min-height:200px;font-size:80px}
  .cat-page{grid-template-columns:1fr}
  .filter-sidebar{display:none}
  .header-top{padding:8px 10px;gap:8px}
}
</style>

<body>

<div id="app"></div>

<div id="toast" class="toast"></div>
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3>🛒 My Cart (<span id="cartItemCount">0</span>)</h3>
    <button class="close-btn" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-body" id="cartBody"></div>
  <div class="cart-footer" id="cartFooter" style="display:none">
    <div class="cart-summary">
      <div class="cart-row"><span>Subtotal</span><span id="cartSubtotal">Rs. 0</span></div>
      <div class="cart-row"><span>Delivery</span><span style="color:var(--green)">FREE</span></div>
      <div class="cart-row"><span>Voucher</span><span id="cartDiscount" style="color:var(--red)">-Rs. 0</span></div>
      <div class="cart-row total"><span>Total</span><span id="cartTotal">Rs. 0</span></div>
    </div>
    <button class="checkout-btn" onclick="checkout()">Proceed to Checkout →</button>

</div>

<div class="modal-overlay" id="productModal" onclick="closeModal(event)">
  <div class="modal-wrap">
    <button class="modal-close" onclick="document.getElementById('productModal').classList.remove('open')">✕</button>
    <div class="modal" id="modalContent"></div>
  </div>
</div>

<div class="auth-overlay" id="authModal">
  <div class="auth-modal" style="position:relative">
    <button class="auth-close" onclick="closeAuth()">✕</button>
    <div class="auth-header">
      <h2>Welcome to BazaarX</h2>
      <p>Pakistan's Smartest Shopping Destination</p>
    </div>
    <div class="auth-body">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" onclick="switchTab('register')">Sign Up</button>
      </div>
      <div id="loginForm">
        <div class="form-group"><label>Email Address</label><input type="email" id="loginEmail" placeholder="you@example.com"></div>
        <div class="form-group"><label>Password</label><input type="password" id="loginPass" placeholder="Enter password"></div>
        <button class="auth-submit" onclick="doLogin()">Login to BazaarX</button>
        <p class="auth-hint">Demo: user@bazaarx.pk / bazaar123</p>
      </div>
      <div id="registerForm" style="display:none">
        <div class="form-group"><label>Full Name</label><input type="text" id="regName" placeholder="Muhammad Ali"></div>
        <div class="form-group"><label>Email Address</label><input type="email" id="regEmail" placeholder="you@example.com"></div>
        <div class="form-group"><label>Phone</label><input type="tel" id="regPhone" placeholder="0300-1234567"></div>
        <div class="form-group"><label>Password</label><input type="password" id="regPass" placeholder="Create password"></div>

</div>

  {id:17,name:"KitchenAid Stand Mixer 4.8L Professional",price:89999,old:109999,cat:"home",brand:"KitchenAid",emoji:"🍳",rating:4.8,reviews:321,stock:7,specs:{Bowl:"4.8L Stainless",Power:"325W",Speeds:"10",Attachments:"3",Colors:"Multiple",Weight:"10.8kg"},desc:"The iconic stand mixer trusted by professional chefs and home bakers worldwide."},

];

const CATEGORIES = [
  {id:"mobiles",icon:"📱",name:"Mobiles"},
  {id:"laptops",icon:"💻",name:"Laptops"},
  {id:"electronics",icon:"🔌",name:"Electronics"},
  {id:"fashion",icon:"👗",name:"Fashion"},
  {id:"shoes",icon:"👟",name:"Shoes"},
  {id:"beauty",icon:"💄",name:"Beauty"},
  {id:"home",icon:"🏠",name:"Home"},
  {id:"sports",icon:"⚽",name:"Sports"},
  {id:"toys",icon:"🧸",name:"Toys"},
  {id:"grocery",icon:"🥦",name:"Grocery"},
];

let cart={};
let wishlist=new Set();
let user=null;
let currentPage='home';
let currentCat=null;
let modalQty=1;
let modalProduct=null;
let searchQ='';
let flashTime=7453;
let wishlistItems=new Set();

function fmt(n){return 'Rs. '+n.toLocaleString()}
function stars(r){return '★'.repeat(Math.round(r))+'☆'.repeat(5-Math.round(r))}
function totalItems(){return Object.values(cart).reduce((a,b)=>a+b.qty,0)}
function totalPrice(){return Object.values(cart).reduce((a,b)=>a+b.price*b.qty,0)}

function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show '+(type);
  setTimeout(()=>t.className='toast',2200);
}

function openCart(){
  document.getElementById('cartOverlay').classList.add('open');
  document.getElementById('cartDrawer').classList.add('open');
  renderCart();
}
function closeCart(){
  document.getElementById('cartOverlay').classList.remove('open');
  document.getElementById('cartDrawer').classList.remove('open');
}

function renderCart(){
  const body=document.getElementById('cartBody');
  const footer=document.getElementById('cartFooter');
  const items=Object.values(cart);
  document.getElementById('cartItemCount').textContent=totalItems();
  updateCartBadge();
  if(!items.length){
    body.innerHTML='<div class="cart-empty"><div class="cart-empty-icon">🛒</div><p>Your cart is empty!</p><p style="font-size:12px;color:#bbb">Start shopping to add items</p></div>';
    footer.style.display='none'; return;
  }
  footer.style.display='block';
  body.innerHTML=items.map(it=>`
    <div class="cart-item">
      <div class="cart-item-img">${it.emoji}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${it.name}</div>
        <div class="cart-item-price">${fmt(it.price)}</div>
        <div class="cart-item-qty">
          <button class="qty-btn" onclick="changeQty(${it.id},-1)">−</button>
          <span class="qty-num">${it.qty}</span>
          <button class="qty-btn" onclick="changeQty(${it.id},1)">+</button>
        </div>
      </div>
      <button class="remove-btn" onclick="removeItem(${it.id})">🗑</button>
    </div>`).join('');
  const sub=totalPrice();
  document.getElementById('cartSubtotal').textContent=fmt(sub);
  document.getElementById('cartDiscount').textContent='-Rs. 0';
  document.getElementById('cartTotal').textContent=fmt(sub);
}

function addToCart(id){
  const p=PRODUCTS.find(x=>x.id===id);
  if(!p)return;
  if(cart[id]){cart[id].qty++;}
  else{cart[id]={...p,qty:1};}
  updateCartBadge();
  showToast('✓ Added to cart!','success');
  renderCart();
}

function changeQty(id,d){
  if(!cart[id])return;
  cart[id].qty+=d;
  if(cart[id].qty<=0)delete cart[id];
  renderCart();
}
function removeItem(id){delete cart[id];renderCart();}

function updateCartBadge(){
  const n=totalItems();
  document.querySelectorAll('.cart-badge').forEach(b=>{b.textContent=n;b.style.display=n?'flex':'none'});
}

function checkout(){
  if(!user){closeCart();openAuth();showToast('Please login to checkout');return;}
  showToast('🎉 Order placed! You will receive a confirmation SMS.','success');
  cart={};renderCart();updateCartBadge();closeCart();
}

function toggleWishlist(id){
  if(wishlist.has(id)){wishlist.delete(id);showToast('Removed from wishlist');}
  else{wishlist.add(id);showToast('❤️ Added to wishlist','success');}
  renderPage();
}

function openModal(id){
  const p=PRODUCTS.find(x=>x.id===id);
  if(!p)return;
  modalProduct=p; modalQty=1;
  const disc=Math.round((1-p.price/p.old)*100);
  document.getElementById('modalContent').innerHTML=`
    <div class="modal-grid">
      <div class="modal-img">${p.emoji}</div>
      <div class="modal-info">
        <div class="modal-badge">${p.brand}</div>
        <div class="modal-title">${p.name}</div>
        <div class="modal-rating">
          <span style="color:#f5a623;font-size:15px">${stars(p.rating)}</span>
          <span style="font-size:13px;color:#666">${p.rating} (${p.reviews.toLocaleString()} ratings)</span>
        </div>
        <div class="modal-price-row">
          <span class="modal-price">${fmt(p.price)}</span>
          <span class="modal-old">${fmt(p.old)}</span>
          <span class="modal-disc">-${disc}%</span>
        </div>
        <div class="modal-shipping">🚚 FREE Delivery • In stock (${p.stock} left) • Usually ships in 1-2 days</div>
        <p style="font-size:13px;color:#555;margin-bottom:14px;line-height:1.5">${p.desc}</p>
        <div class="modal-qty-label">Quantity:</div>
        <div class="modal-qty">
          <button class="modal-qty-btn" onclick="modalChangeQty(-1)">−</button>
          <span class="modal-qty-num" id="modalQtyNum">1</span>
          <button class="modal-qty-btn" onclick="modalChangeQty(1)">+</button>
        </div>
        <div class="modal-actions">
          <button class="modal-cart-btn" onclick="addToCartModal()">Add to Cart</button>
          <button class="modal-buy-btn" onclick="buyNow()">Buy Now</button>
        </div>
        <div class="modal-specs">
          <div style="font-size:13px;font-weight:700;margin-bottom:10px;color:#333">Specifications</div>
          ${Object.entries(p.specs).map(([k,v])=>`<div class="spec-row"><div class="spec-key">${k}</div><div class="spec-val">${v}</div></div>`).join('')}
        </div>
      </div>
    </div>`;
  document.getElementById('productModal').classList.add('open');
}

function modalChangeQty(d){
  modalQty=Math.max(1,Math.min(modalQty+d,modalProduct?.stock||10));
  document.getElementById('modalQtyNum').textContent=modalQty;
}
function addToCartModal(){
  if(!modalProduct)return;
  for(let i=0;i<modalQty;i++)addToCart(modalProduct.id);
  document.getElementById('productModal').classList.remove('open');
}
function buyNow(){
  addToCartModal();
  setTimeout(openCart,200);
}

function closeModal(e){
  if(e.target.id==='productModal')document.getElementById('productModal').classList.remove('open');
}

function openAuth(){document.getElementById('authModal').classList.add('open');}
function closeAuth(){document.getElementById('authModal').classList.remove('open');}
function switchTab(t){
  document.querySelectorAll('.auth-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.auth-tab')[t==='login'?0:1].classList.add('active');
  document.getElementById('loginForm').style.display=t==='login'?'block':'none';
  document.getElementById('registerForm').style.display=t==='register'?'block':'none';
}
function doLogin(){
  const e=document.getElementById('loginEmail').value;
  const p=document.getElementById('loginPass').value;
  if((e==='user@bazaarx.pk'&&p==='bazaar123')||e.includes('@')){
    user={name:'Muhammad Ali',email:e};closeAuth();
    showToast('✓ Welcome back, '+user.name+'!','success');renderHeader();
  } else {showToast('Invalid email or password');}
}
function doRegister(){
  const n=document.getElementById('regName').value;
  const e=document.getElementById('regEmail').value;
  if(n&&e){user={name:n,email:e};closeAuth();showToast('✓ Account created! Welcome, '+n,'success');renderHeader();}
  else {showToast('Please fill all fields');}
}

let searchTimeout;
function handleSearch(v){
  clearTimeout(searchTimeout);
  searchQ=v.trim();
  const box=document.getElementById('searchResults');
  if(!v.trim()){box.style.display='none';return;}
  const results=PRODUCTS.filter(p=>p.name.toLowerCase().includes(v.toLowerCase())||p.brand.toLowerCase().includes(v.toLowerCase())).slice(0,6);
  if(!results.length){box.style.display='none';return;}
  box.innerHTML=results.map(p=>`
    <div class="search-result-item" onclick="openModal(${p.id})">
      <div class="sr-icon">${p.emoji}</div>
      <div class="sr-info"><div class="sr-name">${p.name}</div><div class="sr-price">${fmt(p.price)}</div></div>
    </div>`).join('');
  box.style.display='block';
}

function doSearch(){
  const v=document.getElementById('searchInput').value;
  if(v){document.getElementById('searchResults').style.display='none';currentPage='search';renderPage();}
}

function navigate(page,cat=null){
  currentPage=page;currentCat=cat;
  document.getElementById('searchResults').style.display='none';
  renderPage();
  window.scrollTo({top:0,behavior:'smooth'});
}

function productCard(p){
  const disc=Math.round((1-p.price/p.old)*100);
  const inWish=wishlist.has(p.id);
  return `
    <div class="product-card" onclick="openModal(${p.id})">
      ${disc>0?`<div class="discount-badge">-${disc}%</div>`:''}
      <div class="product-img">${p.emoji}</div>
      <button class="wishlist-btn ${inWish?'active':''}" onclick="event.stopPropagation();toggleWishlist(${p.id})">${inWish?'❤️':'🤍'}</button>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">
          <span class="price-current">${fmt(p.price)}</span>
          ${p.old?`<span class="price-old">${fmt(p.old)}</span>`:''}
        </div>
        <div class="rating-row">
          <span class="stars">${'★'.repeat(Math.round(p.rating))}</span>
          <span class="rating-count">(${p.reviews.toLocaleString()})</span>
        </div>
      </div>
      <button class="add-cart-btn" onclick="event.stopPropagation();addToCart(${p.id})">+ Add to Cart</button>
    </div>`;
}

function renderHeader(){
  const userBtn=user?
    `<button class="header-btn" onclick="navigate('account')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>${user.name.split(' ')[0]}</span></button>`:
    `<button class="header-btn" onclick="openAuth()"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>Login</span></button>`;
  document.getElementById('header').innerHTML=`
    <div style="background:var(--orange)">
      <div class="header-top">
        <div class="logo" onclick="navigate('home')">BazaarX<span>PAKISTAN</span></div>
        <div class="search-bar" style="position:relative">
          <input id="searchInput" type="text" placeholder="Search products, brands & more..." oninput="handleSearch(this.value)" onkeydown="if(event.key==='Enter')doSearch()">
          <select>
            <option>All</option>
            <option>Mobiles</option>
            <option>Laptops</option>
            <option>Fashion</option>
            <option>Electronics</option>
          </select>
          <button class="search-btn" onclick="doSearch()">🔍</button>
          <div id="searchResults" class="search-results" style="display:none"></div>
        </div>
        <div class="header-actions">
          ${userBtn}
          <button class="header-btn" onclick="navigate('wishlist')" style="position:relative">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span>Wishlist</span>

  renderHeader();
  let content='';
  if(currentPage==='home') content=renderHome();
  else if(currentPage==='category') content=renderCategoryPage(currentCat);
  else if(currentPage==='all') content=renderCategoryPage(null);
  else if(currentPage==='flash') content=renderFlash();
  else if(currentPage==='search') content=renderSearch();
  else if(currentPage==='wishlist') content=renderWishlist();
  else if(currentPage==='track') content=renderTrack();
  else if(currentPage==='seller') content=renderSeller();
  else if(currentPage==='account') content=renderAccount();
  document.getElementById('pageContent').innerHTML=content;
  updateCartBadge();
}

setInterval(()=>{
  flashTime=Math.max(0,flashTime-1);
  const h=Math.floor(flashTime/3600),m=Math.floor(flashTime/60)%60,s=flashTime%60;
  document.querySelectorAll('#th').forEach(el=>el&&(el.textContent=String(h).padStart(2,'0')));
  document.querySelectorAll('#tm').forEach(el=>el&&(el.textContent=String(m).padStart(2,'0')));
  document.querySelectorAll('#ts').forEach(el=>el&&(el.textContent=String(s).padStart(2,'0')));
},1000);

document.addEventListener('click',e=>{
  const sr=document.getElementById('searchResults');

});
