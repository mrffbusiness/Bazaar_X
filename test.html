<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BazaarX Connection Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:sans-serif;padding:40px;background:#f5f5f5">
<h2>🔧 BazaarX Connection Test</h2>
<div id="result" style="margin-top:20px;padding:20px;background:#fff;border-radius:8px;border:1px solid #eee">Testing connection...</div>
<script>
const { createClient } = supabase;
const db = createClient(
  'https://eqikgqjgbtjpvmgautli.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxaWtncWpnYnRqcHZtZ2F1dGxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5OTk3NTEsImV4cCI6MjA5NDU3NTc1MX0.sZYsXCKHTNa4AfVAsdT6j5pAtoqeot76XxQ0tn3A0pc'
);

async function test() {
  const r = document.getElementById('result');
  try {
    const { data, error } = await db.from('products').select('id,name,price').limit(3);
    if (error) {
      r.innerHTML = '<h3 style="color:red">❌ ERROR: ' + error.message + '</h3>';
    } else if (!data || data.length === 0) {
      r.innerHTML = '<h3 style="color:orange">⚠️ Connected but NO products found!</h3>';
    } else {
      r.innerHTML = '<h3 style="color:green">✅ Connected! Products found:</h3>' +
        data.map(p => '<p>• ' + p.name + ' — Rs. ' + p.price + '</p>').join('');
    }
  } catch(e) {
    r.innerHTML = '<h3 style="color:red">❌ Exception: ' + e.message + '</h3>';
  }
}
test();
</script>
</body>
</html>
