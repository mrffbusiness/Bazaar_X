<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — BazaarX</title>
<meta name="theme-color" content="#f57224">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f5f5;color:#333;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.card{background:#fff;border-radius:16px;padding:3rem 2.5rem;max-width:500px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.emoji{font-size:80px;margin-bottom:1rem;display:block}
.code{font-size:72px;font-weight:900;color:#f57224;line-height:1;margin-bottom:.5rem}
h1{font-size:22px;font-weight:700;color:#333;margin-bottom:.75rem}
p{color:#888;font-size:15px;line-height:1.6;margin-bottom:2rem}
.btn-primary{display:inline-block;background:#f57224;color:#fff;padding:13px 32px;border-radius:8px;text-decoration:none;font-size:15px;font-weight:700;transition:background .15s;margin:0 6px 12px}
.btn-primary:hover{background:#d4611e}
.btn-outline{display:inline-block;background:#fff;color:#f57224;border:2px solid #f57224;padding:11px 28px;border-radius:8px;text-decoration:none;font-size:15px;font-weight:700;transition:all .15s;margin:0 6px 12px}
.btn-outline:hover{background:#fff3ec}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:0;margin-bottom:1.5rem}
.quick-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid #f0f0f0}
.ql{background:#f9f9f9;border:1px solid #eee;color:#555;padding:6px 14px;border-radius:20px;font-size:12px;text-decoration:none;transition:all .15s}
.ql:hover{background:#fff3ec;border-color:#f57224;color:#f57224}
.countdown{font-size:13px;color:#aaa;margin-top:1rem}
.countdown span{font-weight:700;color:#f57224}
</style>
</head>
<body>
<div class="card">
  <span class="emoji">😕</span>
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or may have been moved. Let's get you back on track!</p>
  <div class="links">
    <a href="https://mrffbusiness.github.io/Bazaar_X/" class="btn-primary">🏠 Go to Homepage</a>
    <a href="https://mrffbusiness.github.io/Bazaar_X/bazaarx-seller-portal.html" class="btn-outline">🏪 Seller Portal</a>
  </div>
  <div class="quick-links">
    <a href="https://mrffbusiness.github.io/Bazaar_X/" class="ql">📱 Mobiles</a>
    <a href="https://mrffbusiness.github.io/Bazaar_X/" class="ql">💻 Laptops</a>
    <a href="https://mrffbusiness.github.io/Bazaar_X/" class="ql">👗 Fashion</a>
    <a href="https://mrffbusiness.github.io/Bazaar_X/" class="ql">⚡ Flash Sale</a>
    <a href="https://mrffbusiness.github.io/Bazaar_X/" class="ql">📦 Track Order</a>
  </div>
  <div class="countdown">Redirecting to homepage in <span id="t">10</span>s</div>
</div>
<script>
let s = 10;
const el = document.getElementById('t');
const iv = setInterval(()=>{
  s--;
  el.textContent = s;
  if(s<=0){ clearInterval(iv); window.location.href='https://mrffbusiness.github.io/Bazaar_X/'; }
},1000);
</script>
</body>
</html>
